}

}

* {

}

html > body {

}

}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

}

.table tbody tr:last-child :is(th, td) {

}

}

.table.table-sm :is(th, td) {

}

}

}

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;

}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

main [data-tooltip]::after {

}

  display: grid;

}

.viz-stat-value {

}

.progress {

.progress-bar:only-child {

.progress-bar {

  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);

.text-small {

.text-muted {

}

.tabular-nums {

.btn,

.btn {

  font-weight: var(--font-weight-normal);
  line-height: 18px;

.viz-carousel-picker > summary {

  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;

  font: inherit !important;

}

.viz-carousel-picker > summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls > button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker > summary {
  padding-inline: 12px !important;
}

  height: 14px;
  flex: none;

.viz-carousel-controls .viz-carousel-caret,
